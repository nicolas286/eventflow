name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main, infra/staging-isolation]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run check:browser-boundary
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder-no-remote-access
          VITE_PUBLIC_BASE_URL: http://127.0.0.1:5173
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
          cache: true
      - name: Check all Edge Functions and shared contracts
        working-directory: supabase/functions
        run: deno task check:edge
      - name: Lint Edge Functions and shared contracts
        working-directory: supabase/functions
        run: deno task lint:edge
      - name: Run Edge unit tests
        working-directory: supabase/functions
        run: deno task test:edge
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.84.2
      - name: Rebuild a disposable local database from migrations
        run: supabase db start
      - name: Check reference data and sensitive permissions
        run: |
          for sql_file in tests/database/*.sql; do
            docker exec -i supabase_db_eventflow-front psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$sql_file"
          done
          node tests/database/invoice-history.checks.mjs supabase_db_eventflow-front
          node tests/database/organizer-migrations.checks.mjs supabase_db_eventflow-front --ci
          node tests/database/organizer-boundary.checks.mjs supabase_db_eventflow-front b1 --ci
          node tests/database/organizer-boundary.checks.mjs supabase_db_eventflow-front b2 --ci
          node tests/database/orders-management.checks.mjs supabase_db_eventflow-front --ci
          node tests/database/b3/orders-concurrency.checks.mjs supabase_db_eventflow-front --ci
          node tests/database/ticket-check-in.checks.mjs supabase_db_eventflow-front --ci
          node tests/database/b4/tickets-concurrency.checks.mjs supabase_db_eventflow-front --ci
          node tests/database/public-catalog.checks.mjs supabase_db_eventflow-front --ci
          node tests/database/edge-boundary.checks.mjs supabase_db_eventflow-front --ci
          node tests/database/platform-corrections.checks.mjs supabase_db_eventflow-front --ci
          node tests/database/organization-suspension-concurrency.checks.mjs supabase_db_eventflow-front --ci
          node tests/database/staging-browser-closure.checks.mjs supabase_db_eventflow-front --ci
          for recipe in tests/database/b2/*concurrency.checks.mjs; do
            node "$recipe" supabase_db_eventflow-front --ci
          done
      - name: Stop the CI database
        if: always()
        run: supabase stop --no-backup
