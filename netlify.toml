[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/share/*"
  to = "/.netlify/functions/share-event"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
# B5: bundle the shared TypeScript DTO consumed by the Node share function.
[functions."share-event"]
  node_bundler = "esbuild"
